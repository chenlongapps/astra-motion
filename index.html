<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111b36" />
    <meta name="description" content="GPT-6 Astra：用代码绘制的 30 秒手绘宇宙动画。" />
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Cg%20fill%3D'%234c77e5'%20stroke%3D'%23172e69'%20stroke-width%3D'2'%3E%3Crect%20x%3D'22'%20y%3D'51'%20width%3D'8'%20height%3D'11'%20rx%3D'3'%2F%3E%3Crect%20x%3D'34'%20y%3D'51'%20width%3D'8'%20height%3D'11'%20rx%3D'3'%2F%3E%3Cpath%20d%3D'M21%2041Q11%2043%2012%2054Q15%2059%2020%2051M43%2041Q53%2043%2052%2054Q49%2059%2044%2051'%2F%3E%3Crect%20x%3D'20'%20y%3D'36'%20width%3D'24'%20height%3D'21'%20rx%3D'7'%2F%3E%3Cpath%20fill%3D'%23719aff'%20d%3D'M11%2035C3%2032%204%2020%2010%2017C8%2010%2017%205%2022%207C25%201%2037%201%2041%207C50%205%2055%2010%2054%2017C62%2020%2061%2031%2054%2035C54%2042%2045%2045%2040%2042C34%2047%2024%2046%2020%2042C13%2044%208%2041%2011%2035Z'%2F%3E%3Crect%20x%3D'15'%20y%3D'14'%20width%3D'35'%20height%3D'24'%20rx%3D'7'%20fill%3D'%23252961'%2F%3E%3C%2Fg%3E%3Cpath%20d%3D'm24%2021%206%205-6%205m13%200h6m-15%2012%203%203-3%203m7%200h4'%20fill%3D'none'%20stroke%3D'%2393f4e7'%20stroke-width%3D'3'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%2F%3E%3C%2Fsvg%3E" />
    <title>GPT-6 Astra</title>
  </head>
  <body>
    <main class="player" aria-label="GPT-6 Astra 动画播放器">
      <div class="heading"><a class="wordmark" href="./">GPT-6 <span>Astra</span><span class="brand-star" aria-hidden="true">✦</span></a><span class="edition">手绘短片</span><span class="spec">30 秒 / 1080P</span><button id="export" class="export-entry" aria-haspopup="dialog" aria-controls="export-dialog" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M5 14v6h14v-6"/></svg><span>导出</span></button></div>
      <div class="stage"><canvas id="film" width="1920" height="1080" aria-label="30 秒手绘宇宙动画，使用下方按钮播放" role="img"></canvas><div id="loading" role="status">正在收集星光…</div></div>
      <div class="controls" aria-label="播放控制">
        <button id="play" aria-label="播放" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg><span>播放</span></button>
        <button id="replay" class="icon-button" aria-label="重播" title="重播" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button>
        <output id="time" aria-live="off">00:00 / 00:30</output>
        <input id="seek" aria-label="播放进度" type="range" min="0" max="1799" value="0" step="1" disabled />
        <button id="mute" class="icon-button" aria-label="静音" aria-pressed="false" title="静音" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zm13-1a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button>
        <button id="fullscreen" class="icon-button" aria-label="全屏" title="全屏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m6 0h5v-5"/></svg></button>
      </div>
      <footer><span>灵感，奔赴群星。</span><span>空格 播放 / 暂停 · ← → 逐帧</span></footer>
      <p id="error" role="alert" hidden></p>
      <dialog id="export-dialog" class="export-dialog" aria-labelledby="export-title" aria-describedby="export-description" aria-busy="false" data-state="settings">
        <div class="export-header">
          <div><h2 id="export-title">导出视频</h2><p id="export-description">完整短片 · 含配乐与音效</p></div>
          <button id="export-close" class="icon-button" aria-label="关闭导出窗口" title="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
        <div class="export-body">
          <figure class="export-preview-panel">
            <div class="export-preview"><canvas id="export-preview" width="640" height="360" role="img" aria-label="当前画面的导出预览"></canvas><span id="export-preview-time">00:00</span></div>
            <figcaption><span>当前画面</span><span id="export-preview-frame">第 1 帧</span></figcaption>
          </figure>
          <section class="export-settings" aria-label="导出设置">
            <dl class="export-file"><dt>文件名</dt><dd id="export-filename">astra-motion-1080p-30fps.mp4</dd></dl>
            <dl class="export-specs"><div><dt>格式</dt><dd>MP4</dd></div><div><dt>时长</dt><dd>30 秒</dd></div><div><dt>帧率</dt><dd id="export-frame-rate">30 fps</dd></div></dl>
            <div id="export-quality" class="export-quality">
              <p id="resolution-label" class="export-quality-label">画质</p>
              <div id="resolution" class="resolution-options" role="group" aria-labelledby="resolution-label" aria-describedby="export-dimensions">
                <button id="resolution-1080p" class="resolution-option" type="button" value="1080p" aria-pressed="true" autofocus disabled><span>1080p</span><span class="resolution-note">Full HD</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 12 4 4 8-8"/></svg></button>
                <button id="resolution-4k" class="resolution-option" type="button" value="4k" aria-pressed="false" disabled><span>4K UHD</span><span class="resolution-note">Ultra HD</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 12 4 4 8-8"/></svg></button>
              </div>
              <p id="fps-label" class="export-quality-label fps-label">帧率</p>
              <div id="export-fps" class="resolution-options" role="group" aria-labelledby="fps-label">
                <button id="fps-30" class="resolution-option" type="button" value="30" aria-pressed="true" disabled><span>30 fps</span><span class="resolution-note">900 帧</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 12 4 4 8-8"/></svg></button>
                <button id="fps-60" class="resolution-option" type="button" value="60" aria-pressed="false" disabled><span>60 fps</span><span class="resolution-note">1800 帧</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 12 4 4 8-8"/></svg></button>
              </div>
            </div>
            <p id="export-dimensions">1920 × 1080</p>
            <div id="export-result" class="export-result" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 12 4 4 8-8"/></svg><div><p>导出完成</p><span id="export-size"></span></div></div>
            <div class="export-feedback">
              <div class="export-status-row"><p id="export-status" role="status">正在检查导出能力…</p><output id="export-percent" hidden>0%</output></div>
              <div id="export-progress-panel" hidden><progress id="export-progress" max="900" value="0" aria-label="视频导出进度"></progress></div>
              <p id="export-error" role="alert" hidden></p>
            </div>
          </section>
        </div>
        <div class="export-footer">
          <p id="export-footer-note">导出后，手动下载到设备</p>
          <div class="export-actions">
            <button id="export-again" class="export-secondary" hidden>重新导出</button>
            <button id="export-cancel" class="export-secondary" hidden>取消导出</button>
            <button id="export-start" class="export-primary" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M5 14v6h14v-6"/></svg><span>开始导出</span></button>
            <button id="download" class="export-primary" disabled hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg><span>下载 MP4</span></button>
          </div>
        </div>
      </dialog>
    </main>
    <audio id="soundtrack" preload="auto" src="./audio/generated.wav"></audio>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
